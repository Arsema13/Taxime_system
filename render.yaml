services:
  - type: web
    name: taxime-backend
    runtime: node
    plan: free
    buildCommand: |
      cd backend
      npm install --include=dev
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: |
      cd backend
      node dist/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taxime-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://taxime-frontend.onrender.com
      - key: PORT
        value: 10000

  - type: web
    name: taxime-frontend
    runtime: node
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm install -g serve
      npm run build
    startCommand: |
      cd frontend
      serve dist -s -l $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://taxime-backend.onrender.com/api

databases:
  - name: taxime-db
    plan: free
    databaseName: taxime_db
    user: taxime_user
