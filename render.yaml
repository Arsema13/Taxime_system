services:
  - type: web
    name: taxime-backend
    runtime: node
    plan: free
    buildCommand: |
      cd backend
      npm install --include=dev
      npx prisma generate
      npx prisma db push --force-reset --accept-data-loss
      npm run build
    startCommand: |
      cd backend
      node dist/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taxime-db
          property: connectionString
      - key: JWT_SECRET
        value: 80620aa415e3d2d695de415a07656d062ef14399d3d103e2094ba58c29e57eea64b20daccf6b78af5fa411fc19db4157ac152797cd2be32795c09fded071c2fa
      - key: JWT_REFRESH_SECRET
        value: 6a85fc3a481ace1c35eabdefd3ab0b91a98c0d8abfa12d89a8be25eb42aefaf25a306b5d8b540f9a95920361bf760a47972153ac2c15ac22f3660fe0e0a17edb
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://taxime-system.vercel.app
      - key: PORT
        value: 10000

  - type: web
    name: taxime-frontend
    runtime: node
    plan: free
    buildCommand: |
      cd frontend
      npm install --include=dev
      npx vite build
    startCommand: |
      cd frontend
      npx serve dist -s -l $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://taxime-backend.onrender.com/api

databases:
  - name: taxime-db
    plan: free
    databaseName: taxime_db
    user: taxime_user
